AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CIC Mock Interview Coach - Evaluator Agent

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256

Resources:
  EvaluatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: evaluator.lambda_handler.handler
      CodeUri: .
      Description: Evaluates mock interview performance for co-op students
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: 'arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-*'

Outputs:
  EvaluatorFunctionUrl:
    Description: Evaluator Function URL endpoint
    Value: !GetAtt EvaluatorFunctionUrl.FunctionUrl
