AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CIC Mock Interview Coach - Evaluator Agent

Parameters:
  HostedFrontendOrigin:
    Type: String
    AllowedPattern: https://.+

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 512

Resources:
  EvaluatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_handler.handler
      CodeUri: .
      Description: Evaluates mock interview performance for co-op students
      Environment:
        Variables:
          HOSTED_GUARDRAILS_ENABLED: 'true'
      FunctionUrlConfig:
        AuthType: AWS_IAM
        Cors:
          AllowOrigins:
            - !Ref HostedFrontendOrigin
            - http://localhost:5173
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type
            - x-amz-content-sha256
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock-mantle:CreateInference
              Resource: '*'
              Condition:
                StringEquals:
                  bedrock-mantle:Model: openai.gpt-oss-120b
            - Effect: Allow
              Action:
                - bedrock-mantle:GetProject
                - bedrock-mantle:ListProjects
                - bedrock-mantle:ListTagsForResource
              Resource: '*'

Outputs:
  EvaluatorFunctionUrl:
    Description: Private IAM-protected Evaluator Function URL
    Value: !GetAtt EvaluatorFunctionUrl.FunctionUrl
