AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CIC Mock Interview Coach - Evaluator Agent

Globals:
  Function:
    Runtime: python3.12
    Timeout: 300
    MemorySize: 512

Resources:
  EvaluatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_handler.handler
      CodeUri: .
      Description: Evaluates mock interview performance for co-op students
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - POST
          AllowHeaders:
            - Content-Type
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock-mantle:CreateInference
              Resource: '*'
              Condition:
                StringEquals:
                  bedrock-mantle:Model: openai.gpt-oss-120b
            - Effect: Allow
              Action:
                - bedrock-mantle:GetProject
                - bedrock-mantle:ListProjects
                - bedrock-mantle:ListTagsForResource
              Resource: '*'

Outputs:
  EvaluatorFunctionUrl:
    Description: Evaluator Function URL endpoint
    Value: !GetAtt EvaluatorFunctionUrl.FunctionUrl
