name: Deploy hosted application

on:
  push:
    branches: [main]
    paths:
      - 'backend/functions/**'
      - 'backend/config/**'
      - 'backend/requirements-dev.txt'
      - 'backend/requirements-local.txt'
      - 'infrastructure/**'
      - '!infrastructure/bin/deployment-automation.ts'
      - '!infrastructure/lib/deployment-automation-stack.ts'
      - 'schemas/**'
      - 'frontend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-application
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Test and deploy backend, then publish frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          test -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" || { echo "Missing AWS_DEPLOY_ROLE_ARN repository variable."; exit 1; }
          test -n "${{ vars.AMPLIFY_APP_ID }}" || { echo "Missing AMPLIFY_APP_ID repository variable."; exit 1; }
          test -n "${{ vars.COST_ALERT_EMAIL }}" || { echo "Missing COST_ALERT_EMAIL repository variable."; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run Python tests
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Build infrastructure
        working-directory: infrastructure
        run: |
          npm ci
          npm run build
          npm test -- --runInBand

      - name: Test frontend before changing hosted infrastructure
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          npm run build

      - name: Confirm revision is still current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || {
            echo 'A newer main revision exists; refusing to publish this stale revision.'
            exit 1
          }

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Discover AgentCore runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_arn="$(aws bedrock-agentcore-control list-agent-runtimes --query "agentRuntimes[?agentRuntimeName=='MockInterviewVoice_MockInterviewVoiceRelay'].agentRuntimeArn | [0]" --output text)"
          test -n "$runtime_arn" && test "$runtime_arn" != "None" || { echo 'AgentCore runtime was not found.'; exit 1; }
          echo "AGENTCORE_RUNTIME_ARN=$runtime_arn" >> "$GITHUB_ENV"

      - name: Deploy Lambda and S3 stack
        working-directory: infrastructure
        shell: bash
        env:
          HOSTED_DAILY_INTERVIEW_LIMIT: ${{ vars.HOSTED_DAILY_INTERVIEW_LIMIT || '100' }}
          HOSTED_DAILY_VIEWER_LIMIT: ${{ vars.HOSTED_DAILY_VIEWER_LIMIT || '100' }}
        run: |
          set -euo pipefail
          [[ "$HOSTED_DAILY_INTERVIEW_LIMIT" =~ ^[1-9][0-9]*$ ]] || {
            echo 'HOSTED_DAILY_INTERVIEW_LIMIT must be a positive integer.'
            exit 1
          }
          (( HOSTED_DAILY_INTERVIEW_LIMIT <= 100 )) || {
            echo 'HOSTED_DAILY_INTERVIEW_LIMIT cannot exceed the source-enforced maximum of 100.'
            exit 1
          }
          [[ "$HOSTED_DAILY_VIEWER_LIMIT" =~ ^[1-9][0-9]*$ ]] || {
            echo 'HOSTED_DAILY_VIEWER_LIMIT must be a positive integer.'
            exit 1
          }
          (( HOSTED_DAILY_VIEWER_LIMIT <= 100 )) || {
            echo 'HOSTED_DAILY_VIEWER_LIMIT cannot exceed the source-enforced maximum of 100.'
            exit 1
          }
          npx cdk deploy MockInterviewStack \
            --parameters "MockInterviewStack:AgentCoreRuntimeArn=$AGENTCORE_RUNTIME_ARN" \
            --parameters "MockInterviewStack:HostedFrontendOrigin=https://main.${{ vars.AMPLIFY_APP_ID }}.amplifyapp.com" \
            --parameters "MockInterviewStack:CostAlertEmail=${{ vars.COST_ALERT_EMAIL }}" \
            --parameters "MockInterviewStack:HostedDailyInterviewLimit=$HOSTED_DAILY_INTERVIEW_LIMIT" \
            --parameters "MockInterviewStack:HostedDailyViewerLimit=$HOSTED_DAILY_VIEWER_LIMIT" \
            --require-approval never

      - name: Load hosted API base URL
        shell: bash
        run: |
          set -euo pipefail
          api_base_url="$(aws cloudformation describe-stacks --stack-name MockInterviewStack --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue | [0]" --output text)"
          test -n "$api_base_url" && test "$api_base_url" != 'None' || { echo 'Missing MockInterviewStack output: ApiBaseUrl'; exit 1; }
          {
            echo 'VITE_RUNTIME_MODE=hosted'
            echo "VITE_API_BASE_URL=$api_base_url"
          } >> "$GITHUB_ENV"

      - name: Build hosted frontend
        working-directory: frontend
        run: npm run build

      - name: Package frontend build
        working-directory: frontend/dist
        run: zip -qr "$RUNNER_TEMP/amplify.zip" .

      - name: Publish Amplify deployment
        shell: bash
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
        run: |
          set -euo pipefail
          aws amplify update-branch \
            --app-id "$AMPLIFY_APP_ID" \
            --branch-name main \
            --no-enable-auto-build >/dev/null
          deployment="$(aws amplify create-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main)"
          job_id="$(jq -r '.jobId' <<<"$deployment")"
          upload_url="$(jq -r '.zipUploadUrl' <<<"$deployment")"
          curl --fail --silent --show-error --request PUT --upload-file "$RUNNER_TEMP/amplify.zip" "$upload_url"
          aws amplify start-deployment --app-id "$AMPLIFY_APP_ID" --branch-name main --job-id "$job_id" >/dev/null

          for _ in {1..60}; do
            status="$(aws amplify get-job --app-id "$AMPLIFY_APP_ID" --branch-name main --job-id "$job_id" --query 'job.summary.status' --output text)"
            case "$status" in
              SUCCEED) echo "Amplify deployment $job_id succeeded."; exit 0 ;;
              FAILED|CANCELLED) echo "Amplify deployment $job_id ended with $status."; exit 1 ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for Amplify deployment $job_id."
          exit 1
