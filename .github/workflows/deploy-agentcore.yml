name: Deploy AgentCore relay

on:
  push:
    branches: [main]
    paths:
      - 'backend/voice_agent/**'
      - 'backend/requirements-dev.txt'
      - 'backend/requirements-local.txt'
      - '!backend/voice_agent/**/*.md'
      - '!backend/voice_agent/tools/**'
      - '.github/workflows/deploy-agentcore.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-agentcore
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Test and deploy voice relay
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: test -n "${{ vars.AWS_DEPLOY_ROLE_ARN }}" || { echo "Missing AWS_DEPLOY_ROLE_ARN repository variable."; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run voice relay tests
        run: pytest -q tests/unit/test_voice_protocol.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install AgentCore CLI
        run: npm install --global @aws/agentcore@0.26.0

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AgentCore deployment target
        shell: bash
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          stacks="$(aws cloudformation list-stacks --query "StackSummaries[?starts_with(StackName, 'AgentCore-MockInterviewVoice-') && StackStatus!='DELETE_COMPLETE'].{name:StackName,status:StackStatus}" --output json)"
          stack_count="$(jq 'length' <<<"$stacks")"
          test "$stack_count" -le 1 || { echo 'Multiple AgentCore deployment stacks were found.'; exit 1; }

          if [ "$stack_count" -eq 1 ]; then
            stack_name="$(jq -r '.[0].name' <<<"$stacks")"
            stack_status="$(jq -r '.[0].status' <<<"$stacks")"
            case "$stack_status" in
              CREATE_COMPLETE|UPDATE_COMPLETE|UPDATE_ROLLBACK_COMPLETE) ;;
              *) echo "AgentCore stack $stack_name is not ready for deployment: $stack_status"; exit 1 ;;
            esac
            target_name="${stack_name#AgentCore-MockInterviewVoice-}"
          else
            target_name='hosted'
          fi

          jq -n \
            --arg name "$target_name" \
            --arg account "$account_id" \
            --arg region "$AWS_REGION" \
            '[{name: $name, description: "Hosted AgentCore voice relay", account: $account, region: $region}]' \
            > backend/voice_agent/agentcore/aws-targets.json
          echo "AGENTCORE_TARGET_NAME=$target_name" >> "$GITHUB_ENV"

      - name: Deploy AgentCore relay
        working-directory: backend/voice_agent
        run: agentcore deploy --target "$AGENTCORE_TARGET_NAME" --yes
